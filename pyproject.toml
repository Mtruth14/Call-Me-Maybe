[project]
name = "call-me-maybe"
version = "1.0.0"
description = "Function calling for small LLMs via constrained decoding (42 project)."
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
    "llm-sdk",
]

[tool.uv.workspace]
members = ["llm_sdk"]

[tool.uv.sources]
llm-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "flake8>=7.0.0",
    "mypy>=1.10.0",
]

[tool.mypy]
strict = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "llm_sdk.*"
ignore_errors = true
